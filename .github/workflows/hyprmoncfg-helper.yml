name: Hyprmoncfg helper tests

on:
  pull_request:
    paths:
      - 'home/dot_local/bin/executable_hyprmoncfg-helper'
      - 'tests/display-session/**'
      - '.github/workflows/hyprmoncfg-helper.yml'
  push:
    branches: [main]
    paths:
      - 'home/dot_local/bin/executable_hyprmoncfg-helper'
      - 'tests/display-session/**'
      - '.github/workflows/hyprmoncfg-helper.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scale-helper:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test scale behavior and command parsing
        run: python3 -m unittest discover -s tests/display-session -p test_scale.py -v
