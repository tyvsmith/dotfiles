name: Build devpod linuxbrew cache

# Builds a prebuilt ~/.linuxbrew tarball for the devpod profile and publishes
# it as a GitHub Release asset under a rolling tag. Devpods fetch this with
# unauthenticated curl during their on-create hook (no ussh token required),
# avoiding the 10-minute timeout from a cold `brew bundle`.
#
# The build runs the full `chezmoi apply` for profile=devpod, so any chezmoi
# template, package, or run_* script regression also fails this workflow.
# Pull requests build and verify the PR branch (devpod and devpod-slim) but
# never publish; only main publishes the release asset.

on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.chezmoiroot'
      - 'home/**'
      - 'install.sh'
      - 'scripts/**'
      - '.github/workflows/devpod-linuxbrew-cache.yml'
  pull_request:
    paths:
      - '.chezmoiroot'
      - 'home/**'
      - 'install.sh'
      - 'scripts/**'
      - '.github/workflows/devpod-linuxbrew-cache.yml'

permissions:
  contents: write

env:
  PLATFORM: debian12-x86_64
  RELEASE_TAG: linuxbrew-cache-debian12-x86_64
  ARCHIVE: linuxbrew-debian12-x86_64.tar.zst
  # Branch under test: the PR head for pull requests, else the pushed/dispatched ref.
  DOTFILES_REF: ${{ github.head_ref || github.ref_name }}

jobs:
  build:
    name: Build linuxbrew tarball (debian:12)
    # Fork PRs: their branch lives in the fork, which install.sh can't clone.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    container:
      image: debian:12
      options: --user root
    steps:
      - name: Install container prerequisites
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            curl ca-certificates git sudo build-essential procps \
            zstd jq file age openssh-client locales
          locale-gen en_US.UTF-8 || true

      - name: Create unprivileged runner user
        run: |
          set -eux
          useradd -m -s /bin/bash builder
          install -d -m 0755 -o builder -g builder /home/builder/work
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chmod 0440 /etc/sudoers.d/builder

      - name: Checkout dotfiles (for manifest hashing only)
        uses: actions/checkout@v4
        with:
          path: checkout

      - name: Apply dotfiles via install.sh (profile=devpod)
        # Mirrors the literal command in personal.devpod.yaml on-create.
        # SKIP_LINUXBREW_FETCH=1 stops the bootstrap from trying to download
        # the cache we are currently building.
        run: |
          set -eux
          sudo -u builder -H \
            SKIP_LINUXBREW_FETCH=1 \
            DOTFILES_REF="$DOTFILES_REF" \
            bash -lc 'cd ~ && curl -fsSL "https://raw.githubusercontent.com/tyvsmith/dotfiles/$DOTFILES_REF/install.sh" | bash -s -- --profile devpod --branch "$DOTFILES_REF"'

      - name: Verify brew is usable
        run: |
          set -eux
          sudo -u builder -H bash -lc '
            export PATH="$HOME/.linuxbrew/bin:$HOME/bin:$PATH"
            brew --version
            brew list --formula --versions | sort > /tmp/brew-versions.txt
            wc -l /tmp/brew-versions.txt
          '

      - name: Build tarball
        run: |
          set -eux
          sudo -u builder -H bash -lc "
            cd \$HOME
            # Runtime-only tree: drop translations, headers, static libs, and
            # doc/info pages (keep man pages, which fish also uses for
            # completions), plus the prefix symlinks that point at them.
            tar --use-compress-program='zstd -T0 -10' \
              --exclude='.linuxbrew/Caskroom' \
              --exclude='.linuxbrew/var/homebrew/locks' \
              --exclude='.linuxbrew/Library/Logs' \
              --exclude='.linuxbrew/Cellar/*/*/share/locale' \
              --exclude='.linuxbrew/Cellar/*/*/share/doc' \
              --exclude='.linuxbrew/Cellar/*/*/share/info' \
              --exclude='.linuxbrew/Cellar/*/*/share/gtk-doc' \
              --exclude='.linuxbrew/Cellar/*/*/include' \
              --exclude='.linuxbrew/share/locale' \
              --exclude='.linuxbrew/share/doc' \
              --exclude='.linuxbrew/share/info' \
              --exclude='.linuxbrew/share/gtk-doc' \
              --exclude='.linuxbrew/include' \
              --exclude='.linuxbrew/*.a' \
              -cf /tmp/${ARCHIVE} \
              .linuxbrew
            ls -lh /tmp/${ARCHIVE}
          "

      - name: Build manifest
        run: |
          set -eux
          PKG_SHA=$(sha256sum checkout/home/.chezmoidata/packages.yaml | awk '{print $1}')
          export PKG_SHA
          sudo -u builder -H -E bash -lc "
            FP=\$(sha256sum /tmp/brew-versions.txt | awk '{print \$1}')
            SZ=\$(stat -c%s /tmp/${ARCHIVE})
            jq -n \
              --arg archive '${ARCHIVE}' \
              --arg brew_fingerprint \"\$FP\" \
              --arg built_at \"\$(date -u +%Y-%m-%dT%H:%M:%SZ)\" \
              --arg built_from_sha '${{ github.sha }}' \
              --arg packages_yaml_sha256 \"\$PKG_SHA\" \
              --arg platform '${PLATFORM}' \
              --argjson archive_size \"\$SZ\" \
              '{archive:\$archive, brew_fingerprint:\$brew_fingerprint, built_at:\$built_at, built_from_sha:\$built_from_sha, packages_yaml_sha256:\$packages_yaml_sha256, platform:\$platform, archive_size:\$archive_size}' \
              > /tmp/manifest.json
            cat /tmp/manifest.json
          "

      - name: Stage release artifacts
        run: |
          set -eux
          mkdir -p /tmp/release
          cp /tmp/${ARCHIVE} /tmp/manifest.json /tmp/release/
          ls -lh /tmp/release

      - name: Upload artifact for publish job
        uses: actions/upload-artifact@v4
        with:
          name: linuxbrew-cache
          path: /tmp/release/
          retention-days: 7
          if-no-files-found: error

  devpod-slim:
    name: Verify devpod-slim apply (debian:12)
    # Fork PRs: their branch lives in the fork, which install.sh can't clone.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    container:
      image: debian:12
      options: --user root
    steps:
      - name: Install container prerequisites
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y --no-install-recommends curl ca-certificates git sudo procps file locales
          locale-gen en_US.UTF-8 || true
          useradd -m -s /bin/bash builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chmod 0440 /etc/sudoers.d/builder

      - name: Apply dotfiles via install.sh (profile=devpod-slim)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          sudo -u builder -H DOTFILES_REF="$DOTFILES_REF" MISE_GITHUB_TOKEN="$GITHUB_TOKEN" \
            bash -lc 'cd ~ && curl -fsSL "https://raw.githubusercontent.com/tyvsmith/dotfiles/$DOTFILES_REF/install.sh" | bash -s -- --profile devpod-slim --branch "$DOTFILES_REF"'

      - name: Verify managed tools run
        run: |
          set -eux
          sudo -u builder -H bash -lc '
            cd ~
            tools=$(sed -n "s/^\"\([^\"]*\)\" = .*/\1/p" ~/.config/mise/conf.d/20-packages.toml)
            broken=0
            for d in $(~/.local/bin/mise bin-paths $tools); do
              for f in "$d"/*; do
                [ -f "$f" ] && [ -x "$f" ] || continue
                if ldd "$f" 2>&1 | grep -q "not found"; then echo "BROKEN: $f"; broken=1; fi
              done
            done
            ~/.local/bin/fish -c "rg --version; atuin --version; tmux -V; nvim --version | head -1"
            exit $broken
          '

  publish:
    name: Publish to GitHub Release
    needs: [build, devpod-slim]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (for gh CLI repo context)
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: linuxbrew-cache
          path: ./release

      - name: Ensure rolling release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" \
              --title "Linuxbrew cache (debian 12, x86_64)" \
              --notes "Rolling cache of \`~/.linuxbrew\` for the devpod profile. Asset and manifest are replaced on every successful workflow run. Consumed by \`home/dot_local/bin/executable_devpod-linuxbrew-fetch\`."
          fi

      - name: Upload assets (replace existing)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          gh release upload "${RELEASE_TAG}" \
            "./release/${ARCHIVE}" \
            "./release/manifest.json" \
            --clobber
          gh release view "${RELEASE_TAG}"
