# =============================================================================
# Package definitions — single source of truth for all platforms
# =============================================================================
#
# Defaults:
#   name:       YAML key          # override for syntax issues (e.g., 7zip)
#   tier:       (required)        # 1=core CLI, 2=dev tools, 3=GUI apps
#   desc:       (required)        # short description
#   brew:       true              # install via Homebrew
#   brew_cask:  false             # use cask instead of formula
#   brew_name:  name              # override Homebrew package name
#   brew_tap:   null              # tap required before install
#   arch:       true              # install on Arch via paru
#   arch_name:  name              # override Arch package name
#   apt:        true              # install via apt
#   apt_name:   name              # override Debian package name
#   apt_bin:    null              # binary name when different on Debian
#   flatpak:    null              # Flatpak app ID (Linux GUI)
#   mas:        null              # Mac App Store ID
#   appimage:   null              # GitHub repo (owner/name) for AppImage
#   os:         null              # restrict to: darwin | linux
#
# Only specify fields that differ from defaults.

