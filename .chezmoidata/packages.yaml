# =============================================================================
# Package definitions — single source of truth for all platforms
# =============================================================================
#
# Cascade order: brew → brew_cask → pacman → apt → dnf → rpm_ostree → flatpak → appimage
# Each package goes to the first enabled manager that can handle it.
# Cascade logic lives in .chezmoitemplates/cascade-filter.
#
# Fields:
#   name:       YAML key          # override for display (e.g., 7zip)
#   tier:       (required)        # 1=core CLI, 2=containers, 3=dev SDKs, 4=hardware, 5=basic UI, 6=extended UI, 7=gaming
#   desc:       (required)        # short description
#   os:         null              # restrict to: darwin | linux
#   work:       null              # absent=all, true=work only, false=personal only
#   decrypt:    null              # absent=all, true=decrypt only, false=no-decrypt only
#
# Native manager fields (tri-state):
#   absent  = available, use YAML key as package name
#   string  = available, use string as override name
#   false   = excluded from this manager
#
#   brew:       (absent)          # Homebrew formula name or false
#   pacman:     (absent)          # Arch/AUR package name or false (paru handles both repos and AUR)
#   apt:        (absent)          # apt package name or false
#   dnf:        (absent)          # dnf package name or false
#
# Brew modifier fields:
#   brew_cask:  false             # true = Homebrew cask (macOS only); name from brew: or YAML key
#   brew_tap:   null              # Homebrew tap required before install
#
# Opt-in manager fields (present = available, absent = N/A):
#   rpm_ostree: false             # true (use YAML key) or package name; immutable Fedora only
#   flatpak:    null              # Flatpak app ID (Linux GUI), or false
#   mas:        null              # Mac App Store ID
#   appimage:   null              # GitHub repo (owner/name) for AppImage, or false
#
# Only specify fields that differ from defaults.

