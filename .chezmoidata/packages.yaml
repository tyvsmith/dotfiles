# Package definitions for multi-platform package management
# This is the single source of truth for all packages across macOS, Arch, and Debian
#
# Package tiers:
#   1 = Core CLI tools (ALL machines)
#   2 = Development tools (is_dev=true)
#   3 = GUI applications (macOS + install_ui_apps=true)
#
# Package managers:
#   brew      - Homebrew (macOS, Linux)
#   pacman    - Arch Linux official repos
#   apt       - Debian/Ubuntu repos
#   aur       - Arch User Repository (requires yay/paru)
#   brew_cask - Homebrew casks (macOS GUI apps)
#   mas       - Mac App Store
#
# Special fields:
#   brew_tap      - Homebrew tap to add before installing
#   apt_binary    - Binary name differs from package name on Debian
#   install_script - Manual installation command when not in repos
#   os            - OS restriction (darwin = macOS only)

packages:
