# =============================================================================
# Package definitions for multi-platform package management
# Single source of truth for all packages across macOS, Arch, Debian, Silverblue
# =============================================================================
#
# Schema:
#   tier: 1 = Core CLI (all machines), 2 = Dev tools (is_dev), 3 = GUI apps (install_ui_apps)
#   desc: Short description (doubles as Brewfile inline comment)
#
#   Install methods per platform (omit = not available on that platform):
#     brew:       Homebrew formula name (macOS, Silverblue CLI)
#     brew_tap:   Homebrew tap required before install
#     brew_cask:  Homebrew cask name (macOS GUI apps)
#     pacman:     Arch Linux official repo package name
#     aur:        AUR package name (when not in official repos)
#     apt:        Debian/Ubuntu package name
#     flatpak:    Flatpak application ID (Linux GUI apps, Silverblue)
#     appimage:   GitHub repo (owner/name) for AppImage releases
#     mas:        Mac App Store ID (integer)
#     script:     Manual install command (fallback when not in any repo)
#
#   Modifiers:
#     apt_bin:    Binary name on Debian when different from package name
#     os:         Restrict to OS: darwin | linux (omit = all platforms)

