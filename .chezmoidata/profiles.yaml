# =============================================================================
# Machine profiles — single source of truth for machine configuration
# =============================================================================
#
# Each profile fully defines a machine setup:
#   desc:     human-readable description (shown during profile selection)
#   tier:     1 = CLI tools only, 2 = + dev tools, 3 = + GUI apps
#   brew/pacman/apt/dnf/flatpak: which package managers to enable
#   is_work:  work machine (system SSH agent, corporate configs)
#   decrypt:  enable age decryption of private configs
#
# Profile is selected interactively during `chezmoi init`, or via:
#   DOTFILES_PROFILE=arch chezmoi init
#   chezmoi init --promptChoice profile=arch
#
# Auto-detected from distro if non-interactive.
#
# NOTE: Adding a new profile here also requires updating:
#   - .chezmoi.toml.tmpl (choices list, writeToStdout descriptions,
#     tier/decrypt/is_work derivation lists)
#   - install.sh is NOT involved — profile selection is handled by chezmoi

profiles:
  # --- macOS ---
  macos-personal:
    desc: "Personal Mac — full dev setup with GUI apps"
    tier: 3
    brew: true
    decrypt: true

  macos-work:
    desc: "Work Mac — full dev setup with corporate config"
    tier: 3
    brew: true
    is_work: true
    decrypt: true

  # --- Arch Linux ---
  arch:
    desc: "Arch Linux desktop — full setup with paru + flatpak"
    tier: 3
    pacman: true
    flatpak: true
    decrypt: true

  # --- Debian/Ubuntu ---
  debian-server:
    desc: "Debian/Ubuntu server — CLI tools only"
    tier: 1
    apt: true

  debian-dev:
    desc: "Debian/Ubuntu dev — CLI + dev tools via apt"
    tier: 2
    apt: true
    decrypt: true

  debian-brew:
    desc: "Debian/Ubuntu dev — Homebrew + flatpak"
    tier: 2
    brew: true
    flatpak: true
    decrypt: true

  # --- Devpods ---
  devpod:
    desc: "Work devpod — dev tools via Homebrew"
    tier: 2
    brew: true
    is_work: true

  # --- Fedora ---
  fedora:
    desc: "Fedora Workstation — full setup with dnf + flatpak"
    tier: 3
    dnf: true
    flatpak: true
    decrypt: true

  # --- Immutable Fedora ---
  silverblue:
    desc: "Fedora Silverblue/Bazzite — immutable desktop"
    tier: 3
    brew: true
    flatpak: true
    decrypt: true
