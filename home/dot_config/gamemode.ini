; ~/.config/gamemode.ini
;
; Purpose: put the game on the V-Cache CCD and leave everything else alone.
; All scheduling features are disabled so ananicy-cpp keeps sole ownership of
; nice, io class, and scheduling policy. See Item 6 of the CachyOS-on-Omarchy
; performance plan.
;
; Requires gamemode-git. The tagged 1.8.2 release has no X3D support and
; silently ignores the CPU-section X3D keys.
;
; INERT until a game is launched through `gamemoderun`.

[general]
; --- Keep out of ananicy-cpp's way -----------------------------------------
; ananicy-cpp applies nice -5 / best-effort / normal to 13,519 game rules and
; reasserts them every 15 seconds. It wins any tug-of-war, so do not start one.
renice=0
softrealtime=off

; ioprio is deliberately unset. `ioprio=off` is documented upstream but is
; rejected even by master, which logs "IO priority value -2 invalid, clamping
; to 0". Omitting it gives the same effective value with no error line.

; --- Keep out of power-profiles-daemon's way -------------------------------
; The global profile is already `performance`; pinning both directions means
; GameMode's governor logic can never move it either way.
desiredgov=performance
defaultgov=performance

; Unused AMD iGPU present. Disable the iGPU power-balancing path outright.
igpu_power_threshold=-1

; Does NOT work under Omarchy/Hyprland: it calls Inhibit on
; org.freedesktop.ScreenSaver, which this desktop does not expose, so it logs
; "No route to host" each launch. `game-performance` uses systemd-inhibit,
; which does work, so GameMode does not replace it for idle inhibition.
inhibit_screensaver=1

[cpu]
; --- The entire reason this file exists ------------------------------------
;
; Two mechanisms exist and they are NOT interchangeable. Measured 2026-08-22:
;
;   amd_x3d_mode_*  GLOBAL scheduler preference. Setting `cache` moves
;                   EVERYTHING to the V-Cache CCD, including a build running
;                   alongside the game. Verified: unrelated background load
;                   went from 99% on CCD1 to 100% on CCD0.
;
;   pin_cores       PER-PROCESS hard affinity. Pins the game, and its children
;                   which inherit it, to the V-Cache CCD. Nothing else moves.
;
; This machine wants a gaming mode and a build mode AT THE SAME TIME, so
; pinning is correct and global mode switching is not. Measured with pinning on
; and the mode switch off:
;
;   game affinity     0-7,16-23     (V-Cache CCD)
;   global x3d mode   frequency     (unchanged)
;   background load   96% on CCD1   (frequency CCD)
;
; Autodetection works on the 9950X3D, so no explicit core list is needed.
; Note: pinning is GameMode's default when unset; this makes it explicit.
pin_cores=yes
park_cores=no

; Global mode switching is deliberately OFF. Enable these two only to bias the
; WHOLE system toward the V-Cache CCD, for a title that scales past 16 threads
; when nothing else is running. It will drag concurrent builds onto the slower
; CCD.
;amd_x3d_mode_desired=cache
;amd_x3d_mode_default=frequency

; Trade-off of pinning, stated plainly: the game gets 8 cores / 16 threads and
; cannot spill onto the other CCD. A title that scales past that loses. The
; global mode switch is a soft preference and would allow the spill.

; No [gpu] section on purpose: it is only honoured from /etc/gamemode.ini, and
; omitting it keeps the overclocking path closed.
