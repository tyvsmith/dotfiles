# FileChooser = gnome swaps the GTK file picker for the GNOME one (breadcrumb
# paths, Space to preview, hidden-file toggle). Needs xdg-desktop-portal-gnome
# and gvfs. The portal refuses to start outside GNOME; the drop-in at
# ../systemd/user/xdg-desktop-portal-gnome.service.d/override.conf gets it past
# that check. Set it back to gtk and delete that drop-in to undo. After either
# change: systemctl --user daemon-reload; restart xdg-desktop-portal{,-gnome}.
[preferred]
default = hyprland;gtk
org.freedesktop.impl.portal.FileChooser = gnome
org.freedesktop.impl.portal.Secret = gnome-keyring
