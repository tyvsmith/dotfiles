# CONTROL Resonant (appid 3669870)
#
# Common settings and the wrapper chain come from ../scb.conf.
#
# Gamescope mode: native mode hangs the GPU (NVRM Xid 109, CTX SWITCH TIMEOUT;
# VK_ERROR_DEVICE_LOST; audio keeps playing) in menus or on New Game, on both
# GE-Proton11-7 and proton-cachyos 20260703 (RTX 5090, driver 615.71.09).
# DLSS was not the cause: FSR hung too. Gamescope runs clean with HDR and DLSS.
# Trigger not isolated; suspects are what native adds and gamescope drops:
# PROTON_ENABLE_WAYLAND, DXVK_HDR, the visible in-game MangoHud.
# Upstream: https://github.com/HansKristian-Work/vkd3d-proton/issues/3327

# TESTING 2026-09-29: gamescope hangs too (Xid 109) at a fixed spot in the
# game, matching https://github.com/HansKristian-Work/vkd3d-proton/issues/3330
# (HDR-only; turning in-game HDR off is that issue's workaround). ProtonDB
# reports this flag clearing Xid 109. Proton appends to VKD3D_CONFIG, so it
# survives. If the hang persists, remove it and try in-game HDR off instead.
export VKD3D_CONFIG=descriptor_heap
export VKD3D_DISABLE_EXTENSIONS=VK_NV_raw_access_chains

mode native
