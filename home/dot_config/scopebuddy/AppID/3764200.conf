# Resident Evil Requiem (appid 3764200)
#
# Common settings and the wrapper chain come from ../scb.conf.
# This file carries only what is specific to this title.

# Forces the D3D12 feature level. Retained from the original launch string.
export VKD3D_FEATURE_LEVEL=12_2

# Game argument, appended after %command%. Not an env var. Disables the game's
# own Wine detection so it stops gating features it treats as Windows-only.
command="$command /WineDetectionEnabled:False"
