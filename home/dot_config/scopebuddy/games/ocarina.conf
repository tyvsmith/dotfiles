APP_ID=ocarina
# Native Wayland Vulkan HDR10; gamescope would only add a second HDR path.
mode=native
# HDR needs Wayland, which Steam's environment can bypass; Gamescope sessions keep their default.
(( SCB_GAMEMODE )) || game_env SDL_VIDEODRIVER wayland
# Steam Input cannot see a Wayland window's focus, so its virtual pad stays idle.
# With Steam Input disabled for the shortcut, let SDL open the physical controller.
game_env SDL_GAMECONTROLLER_IGNORE_DEVICES ""
game_env SDL_GAMECONTROLLER_ALLOW_STEAM_VIRTUAL_GAMEPAD 0
# The game paces itself (30/60 fps steps plus DLSS frame generation).
fps_limiter=game


# nx2navi.ini fixes the local 21:9 ultrawide picture and its refresh. A stream takes
# the client's size and rate instead; environment values override the file.
if [[ $context == streaming && -n $width && -n $height ]]; then
    game_env NX2NAVI_GAME_ASPECT window
    game_env NX2NAVI_WINDOW_SIZE "${width}x$height"
    game_env NX2NAVI_GAME_RES "$height"
    # "display" paces to the stream's refresh. NX2navi 0.10.1 still counts drawn frames under
    # Linux frame generation, which HDR keeps off; dynamic adds the fewest frames meanwhile.
    game_env NX2NAVI_FPS_LIMIT display
    game_env NX2NAVI_FG_MULT dynamic
fi
