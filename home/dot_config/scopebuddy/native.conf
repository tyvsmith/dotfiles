# Direct Wine-Wayland rendering; the default unless a title selects Gamescope.
SCB_NOSCOPE=1
SCB_GAMESCOPE_ARGS=""
export PROTON_ENABLE_WAYLAND=${PROTON_ENABLE_WAYLAND-1}
export DXVK_HDR=${DXVK_HDR-1}

# SCB skips its pre-hook in native mode; call its runner before the game.
command="pre_command && $wrapped_command"
apply_desktop_defaults
