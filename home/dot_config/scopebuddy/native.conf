# Direct Wine-Wayland rendering; opt in with mode=native.
SCB_NOSCOPE=1
SCB_GAMESCOPE_ARGS=""
export PROTON_ENABLE_WAYLAND=${PROTON_ENABLE_WAYLAND-1}
export DXVK_HDR=${DXVK_HDR-1}
export MANGOHUD=${MANGOHUD-1}
fps_limiter=${fps_limiter:-mangohud}
case $fps_limiter in
    mangohud)
        if [[ $MANGOHUD == 0 && $fps_cap != 0 ]]; then
            printf 'ScopeBuddy: MANGOHUD=0 disables the FPS limiter; set an in-game limit and fps_limiter=game.\n' >&2
        fi
        export MANGOHUD_CONFIG="read_cfg,${MANGOHUD_CONFIG:+$MANGOHUD_CONFIG,}fps_limit=$fps_cap"
        ;;
    game) export MANGOHUD_CONFIG="read_cfg,${MANGOHUD_CONFIG:+$MANGOHUD_CONFIG,}fps_limit=0" ;;
    *) printf 'ScopeBuddy: unsupported native fps_limiter: %s\n' "$fps_limiter" >&2; return 1 ;;
esac
unset MANGOHUD_FPS_LIMIT

# SCB skips its pre-hook in native mode; call its runner before the game.
command="pre_command && $wrapped_command"
apply_desktop_defaults
