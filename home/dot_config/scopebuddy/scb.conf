# ~/.config/scopebuddy/scb.conf
#
# Layer 2: defaults every game inherits. Sourced as bash BEFORE
# AppID/<appid>.conf, so anything a per-title file sets wins over this.
#
# Layering, per Item 20 of the CachyOS-on-Omarchy performance plan:
#   layer 0  ~/.config/environment.d/gaming.conf   every GL/Vulkan client
#   layer 2  this file, then modes/native.conf     every game
#   layer 3  AppID/<appid>.conf                    one title; may switch with
#                                                  `mode gamescope`, override after
#   layer 4  Steam launch options                  wrapper + game arguments

# ---------------------------------------------------------------------------
# Gaming defaults that hold in BOTH modes. Anything whose value differs
# between gamescope and native lives in modes/<name>.conf, never here.
# ---------------------------------------------------------------------------
export PROTON_DLSS_UPGRADE=1
export MANGOHUD=1
# Applied by hypr/placement.lua independently of local/stream workspace selection.
export HYPR_FULLSCREEN=1

# A focused Punktfunk output identifies the launch destination, including
# games launched manually from the streamed desktop. A tablet alone is not enough.
scb_punktfunk_stream=0
scb_punktfunk_output=
scb_stream_width=0 scb_stream_height=0 scb_stream_fps=0
if command -v punktfunk-host >/dev/null && command -v hyprctl >/dev/null; then
    scb_pf_status=$(timeout 2 punktfunk-host ctl status --json 2>/dev/null) || scb_pf_status=
    scb_pf_monitors=$(timeout 2 hyprctl -j monitors 2>/dev/null) || scb_pf_monitors=
    if jq -e '.data.active_sessions > 0' <<< "$scb_pf_status" >/dev/null 2>&1; then
        scb_pf_mode=$(jq -er '
            [.[] | select(.focused == true and .disabled != true and (.name | startswith("PF-")))] |
            if length == 1 then .[0] else empty end |
            select(.width > 0 and .height > 0 and .refreshRate > 0) |
            [.name, .width, .height, (.refreshRate | round)] | @tsv
        ' <<< "$scb_pf_monitors" 2>/dev/null) || scb_pf_mode=
        if [[ -n $scb_pf_mode ]]; then
            read -r scb_punktfunk_output scb_stream_width scb_stream_height scb_stream_fps <<< "$scb_pf_mode"
            scb_punktfunk_stream=1
        fi
    fi
    unset scb_pf_status scb_pf_monitors scb_pf_mode
fi

# Work around headless outputs advertising max luminance below reference white.
# Preserve valid peaks, even below 1000. This fallback is not client calibration; 0 opts out.
scb_prepare_punktfunk() {
    local peak=${SCB_PUNKTFUNK_HDR_MAX_LUMINANCE:-1000} monitors rule reply metadata decision
    [[ $peak == 0 ]] && return 0
    if [[ ! $peak =~ ^[1-9][0-9]{0,4}$ ]] || (( peak > 10000 )); then
        printf 'ScopeBuddy: invalid streaming HDR luminance: %s\n' "$peak" >&2
        return 1
    fi
    monitors=$(timeout 2 hyprctl -j monitors) || return 1
    decision=$(jq -er --arg output "$scb_punktfunk_output" '
        [.[] | select(.name == $output and .disabled != true)] |
        if length != 1 then error("streaming output disappeared") else .[0] end |
        if .colorManagementPreset == "hdr" or .colorManagementPreset == "hdredid"
        then "hdr" else "skip" end
    ' <<< "$monitors") || return 1
    [[ $decision == skip ]] && return 0
    # Monitor JSON omits the peak. Read the same Wayland luminance event Wine sees.
    metadata=$(timeout 3 scb-output-luminance "$scb_punktfunk_output") || {
        printf 'ScopeBuddy: cannot read HDR metadata; leaving output unchanged.\n' >&2
        return 1
    }
    decision=$(jq -er --arg output "$scb_punktfunk_output" --argjson monitors "$monitors" --argjson peak "$peak" '
        def fallback($white):
            if $peak <= $white then error("HDR fallback must exceed reference white") else "fallback" end;
        if .output != $output then error("wrong output metadata") else . end |
        (.reference_luminance // ($monitors[] | select(.name == $output) | .sdrMaxLuminance) // 203) as $white |
        if ($white | type) != "number" or $white <= 0 then error("invalid reference white")
        elif .max_luminance == null then fallback($white)
        elif (.max_luminance | type) != "number" then error("invalid peak metadata")
        elif .max_luminance <= $white then fallback($white) else "preserve" end
    ' <<< "$metadata") || return 1
    [[ $decision == preserve ]] && return 0
    # Re-check that the output is still HDR; update only its peak on the existing rule.
    monitors=$(timeout 2 hyprctl -j monitors) || return 1
    rule=$(jq -er --arg output "$scb_punktfunk_output" --argjson peak "$peak" '
        [.[] | select(.name == $output and .disabled != true)] |
        if length != 1 then error("streaming output disappeared") else .[0] end |
        if .colorManagementPreset != "hdr" and .colorManagementPreset != "hdredid"
        then "skip" else
            "hl.monitor({output=" + (.name | tojson) + ",max_luminance=" + ($peak | tostring) + "})"
        end
    ' <<< "$monitors") || return 1
    [[ $rule == skip ]] && return 0
    reply=$(timeout 3 hyprctl eval "$rule") || return 1
    # hyprctl can return zero even when Lua rejects a rule.
    if [[ $reply != ok ]]; then
        printf 'ScopeBuddy: HDR override rejected: %s\n' "$reply" >&2
        return 1
    fi
    # The eval reply precedes the compositor's new Wayland image description.
    local attempt
    for attempt in {1..10}; do
        metadata=$(timeout 3 scb-output-luminance "$scb_punktfunk_output") || return 1
        if jq -e --arg output "$scb_punktfunk_output" '
            .output == $output and
            (.reference_luminance | type) == "number" and .reference_luminance > 0 and
            (.max_luminance | type) == "number" and .max_luminance > .reference_luminance
        ' <<< "$metadata" >/dev/null; then
            return 0
        fi
        sleep 0.05
    done
    printf 'ScopeBuddy: stream HDR metadata did not become valid; aborting launch.\n' >&2
    return 1
}

# Explicit lifecycle, no window detector. Only a successful start needs cleanup.
scb_local_hdr_enabled=0
scb_set_local_hdr() {
    local reply
    reply=$(timeout 3 hyprctl eval "lg_hdr($1)") || return 1
    if [[ $reply != ok ]]; then
        printf 'ScopeBuddy: LG HDR command rejected: %s\n' "$reply" >&2
        return 1
    fi
}
scb_start_local() {
    scb_set_local_hdr true || return 1
    scb_local_hdr_enabled=1
    # Monitor rules commit after the eval reply. Wait before the game probes HDR.
    local attempt
    for attempt in {1..20}; do
        if timeout 1 hyprctl -j monitors | jq -e 'any(.[]; .name == "DP-1" and .colorManagementPreset == "hdr")' >/dev/null; then
            return 0
        fi
        sleep 0.05
    done
    printf 'ScopeBuddy: LG did not enter HDR; aborting launch.\n' >&2
    return 1
}
scb_stop_local() {
    if (( scb_local_hdr_enabled )); then scb_set_local_hdr false; fi
}

fps_cap=161
display_start=:
if (( scb_punktfunk_stream )); then
    unset HYPR_WORKSPACE SCB_PRE_COMMAND SCB_POST_COMMAND
    display_start=scb_prepare_punktfunk
else
    export HYPR_WORKSPACE=6
    if [[ -n ${HYPRLAND_INSTANCE_SIGNATURE:-} ]]; then
        display_start=scb_start_local
        SCB_POST_COMMAND=scb_stop_local
    fi
fi
if (( scb_stream_width > 0 )); then fps_cap=$scb_stream_fps; fi
export MANGOHUD_CONFIG=preset=2,fps_limit=$fps_cap
export PROTON_LOG_DIR="$HOME/.cache/proton-logs"

# ---------------------------------------------------------------------------
# Wrapper chain, as pristine pieces the mode files assemble into $command.
#
# ScopeBuddy has no dedicated wrapper option, but it `eval`s $command after
# sourcing these config files, and the README documents $command as available
# to them. Building the chain here keeps the Steam launch string down to a
# bare `scb -- %command%` for every title.
#
# Order, outermost first:
#   game-performance  systemd-inhibit + a power-profiles-daemon performance
#                     hold, and it moves an active scx scheduler to its gaming
#                     profile. On this machine the profile is already
#                     `performance` and no scx scheduler is attached, so its
#                     live contribution is the idle inhibitor -- which matters,
#                     because GameMode's inhibit_screensaver does not work
#                     under Hyprland.
#   gamemoderun       registers with gamemoded, which pins the process and its
#                     children to the V-Cache CCD (0-7,16-23). See
#                     ~/.config/gamemode.ini.
# ---------------------------------------------------------------------------
game_command="$command"
wrapped_command="game-performance gamemoderun $game_command"

# ---------------------------------------------------------------------------
# Modes. Each modes/<name>.conf writes the COMPLETE conflicting set -- sets
# its own side, unsets the other's -- so `mode X` is a full state transition:
# idempotent, correct whatever ran before it. A per-title conf switches with
# `mode gamescope`, then overrides after (straight-line bash, later lines win).
# ---------------------------------------------------------------------------
mode() { source "$HOME/.config/scopebuddy/modes/$1.conf"; }
mode native

# ---------------------------------------------------------------------------
# Opting a title OUT. These are exports, so a per-title file unsets them:
#
#   # ~/.config/scopebuddy/AppID/<appid>.conf
#   unset PROTON_ENABLE_WAYLAND     # this title breaks on Wine-Wayland
#   unset DXVK_HDR                  # keep game rendering SDR; monitor stays HDR
#   unset HYPR_FULLSCREEN           # leave initial fullscreen to the game
#   unset PROTON_DLSS_UPGRADE       # keep the shipped DLSS DLL
#   export MANGOHUD=0               # or DISABLE_MANGOHUD=1; no overlay
#
# The wrapper chain is rebuilt from the pristine pieces, not pattern-stripped.
# After the mode line, e.g. drop performance wrappers but keep display setup:
#   command="$display_start && $game_command" # native titles
#   command="$game_command"                 # gamescope titles (no `;` allowed)
#
# Never set anywhere. Verified zero occurrences in the installed runner
# (proton-cachyos 11.0-20260703) on 2026-08-22, so they are silently ignored:
#   PROTON_ENABLE_HDR   PROTON_VKD3D_HEAP   PROTON_USE_NTSYNC
#
# SCB_AUTO_HDR stays off: it exports the retired PROTON_ENABLE_HDR, and its
# display detection is KDE/GNOME only (the wlroots branch is a stub), so it is
# inert on Hyprland regardless.
#
# Game ARGUMENTS (e.g. /WineDetectionEnabled:False) are not env vars. Append
# them in the AppID conf with  command="$command <arg>"  -- and after the
# `mode` line if the title has one, since a mode rebuilds $command wholesale.
# ---------------------------------------------------------------------------

# Uncomment during a migration to log the expanded command to
# ~/.config/scopebuddy/scopebuddy.log
#SCB_DEBUG=1
