# Shared by scb.conf and gamemode.conf; game overrides load below.
# Display lifecycle and per-game examples: docs/display-session.md in dotfiles.
export PROTON_DLSS_UPGRADE=1
export NVPRESENT_ENABLE_SMOOTH_MOTION=1
export PROTON_LOG_DIR="$HOME/.cache/proton-logs"
mode=gamescope

source "$SCB_CONFIGDIR/common.sh" || exit 1
display_init || exit 1
context=$(get_display_context)
width=$(get_display_width)
height=$(get_display_height)
refresh=$(get_display_fps)
source "$SCB_CONFIGDIR/$context.conf" || exit 1
fps_cap=$(get_display_fps_cap "$fps_margin")

load_game_config
apply_mode

# Log the expanded launch command to ~/.config/scopebuddy/scopebuddy.log:
#SCB_DEBUG=1
