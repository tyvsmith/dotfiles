# Shared defaults; AppID/<appid>.conf is sourced afterward and can override them.
# Display lifecycle and per-game examples: docs/display-session.md in dotfiles.
export PROTON_DLSS_UPGRADE=1
export MANGOHUD=1
export HYPR_FULLSCREEN=1
export PROTON_LOG_DIR="$HOME/.cache/proton-logs"

source "$HOME/.config/scopebuddy/lib/display.sh" || exit 1
scb_display_init

# Local games use workspace 6; streams retain their virtual screen's workspace.
fps_cap=161
if (( scb_punktfunk_stream )); then
    unset HYPR_WORKSPACE
    fps_cap=$scb_stream_fps
else
    export HYPR_WORKSPACE=6
fi
export MANGOHUD_CONFIG=preset=2,fps_limit=$fps_cap
SCB_POST_COMMAND=scb_display_stop

# Keep the original command so per-game mode changes rebuild the wrapper once.
game_command="$command"
wrapped_command="game-performance gamemoderun $game_command"
mode() { source "$HOME/.config/scopebuddy/modes/$1.conf"; }
mode native

# Log the expanded launch command to ~/.config/scopebuddy/scopebuddy.log:
#SCB_DEBUG=1
