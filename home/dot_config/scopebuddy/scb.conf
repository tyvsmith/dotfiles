# Shared defaults; context and game profiles override these below.
source "$SCB_CONFIGDIR/common.sh" || exit 1
init_game_env
mode=gamescope
# fps_cap=120              # Default: display refresh minus context fps_margin; 0 uncaps.
# fps_limiter=game         # Default: mangohud; gamescope requires a verified working build.

game_env PROTON_DLSS_UPGRADE 1
game_env PROTON_LOG_DIR "$HOME/.cache/proton-logs"
# Opt in per game; with 2x interpolation, fps_cap=80 targets about 160 presented FPS.
# game_env_default NVPRESENT_ENABLE_SMOOTH_MOTION 1

configure_launch || exit 1

# Log the expanded launch command to ~/.config/scopebuddy/scopebuddy.log:
#SCB_DEBUG=1
