# ~/.config/scopebuddy/modes/native.conf
#
# Native mode: no gamescope, the game talks to Hyprland directly. The default
# for every title (../scb.conf sources this last); a per-title conf switches
# away with `mode gamescope`.
#
# Owns the complete mode-conflicting set; see the Modes block in ../scb.conf.

SCB_NOSCOPE=1
SCB_GAMESCOPE_ARGS=""

# Wine-Wayland and HDR straight to the compositor.
export PROTON_ENABLE_WAYLAND=1
export DXVK_HDR=1

# Native mode has no pre-command hook; configure the output before launching.
unset SCB_PRE_COMMAND
command="$display_start && $wrapped_command"
