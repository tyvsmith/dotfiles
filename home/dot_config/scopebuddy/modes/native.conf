# Direct Wine-Wayland rendering; the default unless a title selects Gamescope.
SCB_NOSCOPE=1
SCB_GAMESCOPE_ARGS=""
export PROTON_ENABLE_WAYLAND=1
export DXVK_HDR=1

# SCB skips its pre-hook in native mode, so gate the game command directly.
unset SCB_PRE_COMMAND
command="scb_display_start && $wrapped_command"
