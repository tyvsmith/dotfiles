# ~/.config/scopebuddy/modes/gamescope.conf
#
# Gamescope mode: opt in from a per-title conf with `mode gamescope`, then
# override any of this after that line.
#
# Owns the complete mode-conflicting set; see the Modes block in ../scb.conf.

SCB_NOSCOPE=0
# --mangoapp: gamescope spawns mangoapp as its own overlay plane -- HUD shows
# gamescope's composited/flipped frames (what the display actually did), stays
# crisp under any upscaling, and is color-managed for HDR. It reads the outer
# MANGOHUD_CONFIG from ../scb.conf.
SCB_GAMESCOPE_ARGS="-w 5120 -h 2160 -W 5120 -H 2160 -r 165 -f --hdr-enabled --hdr-itm-enable --fullscreen --adaptive-sync --mangoapp"
if (( scb_stream_width > 0 )); then
    SCB_GAMESCOPE_ARGS="-w $scb_stream_width -h $scb_stream_height -W $scb_stream_width -H $scb_stream_height -r $scb_stream_fps -f --hdr-enabled --mangoapp"
fi

# Gamescope supplies the game's Wayland display and HDR itself (WSI layer);
# the direct-to-compositor switches from native mode must not leak through.
unset PROTON_ENABLE_WAYLAND
unset DXVK_HDR

# Configure the physical output before Gamescope probes HDR capabilities.
# ScopeBuddy otherwise logs a pre-command failure and launches anyway.
SCB_PRE_COMMAND="$display_start || exit 1"

# The in-game layer stays loaded purely as the fps limiter: mangoapp cannot
# cap (out of process) and gamescope's --framerate-limit only does
# refresh-divisor steps (165, 82, ...), so the game gets a private
# MANGOHUD_CONFIG -- invisible layer, cap enforced in-process. mangoapp keeps
# the outer config; without no_display here the HUD would draw twice.
#
# No `;` compounds in command here: it is embedded inside the gamescope
# invocation (`gamescope ... -- env ... $command`). The env prefix is safe.
command="env MANGOHUD_CONFIG=no_display,fps_limit=$fps_cap $wrapped_command"
