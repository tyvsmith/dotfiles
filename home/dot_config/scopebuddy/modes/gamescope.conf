# Opt in with `mode gamescope` in an AppID config; overrides follow that line.
SCB_NOSCOPE=0
SCB_GAMESCOPE_ARGS="-w 5120 -h 2160 -W 5120 -H 2160 -r 165 -f --hdr-enabled --hdr-itm-enable --fullscreen --adaptive-sync --mangoapp"
if (( scb_stream_width > 0 )); then
    SCB_GAMESCOPE_ARGS="-w $scb_stream_width -h $scb_stream_height -W $scb_stream_width -H $scb_stream_height -r $scb_stream_fps -f --hdr-enabled --mangoapp"
fi

# Gamescope supplies HDR; clear the direct-to-Hyprland flags from native mode.
unset PROTON_ENABLE_WAYLAND DXVK_HDR

# Prepare before Gamescope probes HDR; SCB would otherwise continue on failure.
SCB_PRE_COMMAND="scb_display_start || exit 1"

# Mangoapp draws the HUD; the hidden in-game layer supplies the exact FPS cap.
# No shell compounds here: SCB embeds this command inside Gamescope's argv.
command="env MANGOHUD_CONFIG=no_display,fps_limit=$fps_cap $wrapped_command"
