# Default compositor settings; explicit game settings override these defaults.
SCB_NOSCOPE=0
fps_limiter=${fps_limiter:-gamescope}
case $fps_limiter in
    gamescope|game) command="$wrapped_command" ;;
    mangohud)
        if [[ ${MANGOHUD-1} == 0 ]]; then
            printf 'ScopeBuddy: the mangohud limiter requires MANGOHUD=1; use fps_limiter=game for an in-game limit.\n' >&2
            return 1
        fi
        # This layer only limits; Mangoapp owns all HUD interaction and logging.
        command="env MANGOHUD=1 MANGOHUD_CONFIG=no_display,fps_limit=$fps_cap,toggle_hud=,toggle_preset=,toggle_fps_limit=,toggle_logging=,reload_cfg= $wrapped_command"
        ;;
    *) printf 'ScopeBuddy: unknown fps_limiter: %s\n' "$fps_limiter" >&2; return 1 ;;
esac
export MANGOHUD=0
# Steam mode otherwise substitutes a temporary no_display config.
export MANGOHUD_CONFIGFILE=${MANGOHUD_CONFIGFILE:-${XDG_CONFIG_HOME:-$HOME/.config}/MangoHud/MangoHud.conf}
export MANGOHUD_CONFIG="read_cfg,${MANGOHUD_CONFIG:+$MANGOHUD_CONFIG,}fps_limit=0"
unset MANGOHUD_FPS_LIMIT

# Gamescope's -r accepts an integer; the snapshot retains fractional refresh.
LC_NUMERIC=C printf -v gamescope_refresh '%.0f' "$refresh"
if [[ -z ${SCB_GAMESCOPE_ARGS:-} ]]; then
    # Matching virtual refresh avoids rounding a below-refresh cap to a divisor.
    if [[ $fps_limiter == gamescope && $fps_cap != 0 ]]; then
        gamescope_refresh=$fps_cap
    fi
    SCB_GAMESCOPE_ARGS="-w $width -h $height -W $width -H $height -r $gamescope_refresh -f --force-windows-fullscreen --hdr-enabled --mangoapp"
    if [[ $fps_limiter == gamescope && $fps_cap != 0 ]]; then
        SCB_GAMESCOPE_ARGS+=" --framerate-limit $fps_cap"
    fi
    if [[ $context == local ]]; then
        SCB_GAMESCOPE_ARGS+=" --adaptive-sync"
    fi
fi

apply_desktop_defaults
