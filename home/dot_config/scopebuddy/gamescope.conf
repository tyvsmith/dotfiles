# Default compositor settings; explicit game settings override these defaults.
SCB_NOSCOPE=0
if [[ -z ${SCB_GAMESCOPE_ARGS:-} ]]; then
    SCB_GAMESCOPE_ARGS="-w $width -h $height -W $width -H $height -r $gamescope_refresh -f --force-windows-fullscreen --hdr-enabled --mangoapp$gamescope_limit_args"
    if [[ $context == local ]]; then
        SCB_GAMESCOPE_ARGS+=" --adaptive-sync"
    fi
fi

apply_desktop_defaults
