# Opt in with mode=gamescope; explicit game settings override these defaults.
SCB_NOSCOPE=0
# Gamescope's -r accepts an integer; the snapshot retains fractional refresh.
LC_NUMERIC=C printf -v gamescope_refresh '%.0f' "$refresh"
if [[ -z ${SCB_GAMESCOPE_ARGS:-} ]]; then
    SCB_GAMESCOPE_ARGS="-w $width -h $height -W $width -H $height -r $gamescope_refresh -f --hdr-enabled --mangoapp"
    if [[ $context == local ]]; then
        SCB_GAMESCOPE_ARGS+=" --adaptive-sync"
    fi
fi

# Mangoapp draws the HUD; the hidden in-game layer supplies the exact FPS cap.
# No shell compounds here: SCB embeds this command inside Gamescope's argv.
command="env MANGOHUD_CONFIG=no_display,fps_limit=$fps_cap $wrapped_command"
apply_desktop_defaults
