# Graph clock.
#
# Pinned to 48000 with no alternatives, deliberately:
#   - the HeSuVi IR is 48 kHz, so the convolver never resamples it. Leaving
#     96000 reachable would break that, since the Maxwell supports 96k.
#   - the Maxwell supports ONLY 48000 and 96000 - no 44100. Spotify's 44.1 kHz
#     is resampled to 48 whether it goes through the HRTF chain or bypasses it,
#     so allowing 44100 buys nothing on the headphone path.
#   - the Hive reaches 384 kHz, but nothing in use produces content above 48 k
#     that survives its own client (tidal-hifi is Electron, Spotify is 44.1).
#
# One resample, at a known point, into a rate every device runs natively.
context.properties = {
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 48000 ]
}
