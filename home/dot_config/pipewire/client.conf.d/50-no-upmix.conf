# Disable synthetic upmix.
#
# PipeWire defaults to channelmix.upmix = true with method "psd": a fabricated
# front-center lowpassed at 12 kHz, a fabricated LFE lowpassed at 150 Hz, and
# rear channels manufactured from the L-R difference with 12 ms of delay.
#
# With an 8-channel HRTF sink in the path, every stereo source would get all of
# that invented before the convolver touched it. Off means stereo stays in
# FL/FR and meets only the FL/FR impulses - clean binaural crossfeed.
#
# Multichannel content is unaffected: upmix only ever synthesizes channels the
# source does not have.
#
# Mirrored in pipewire-pulse.conf.d/ because Pulse clients (Spotify, Steam,
# every Flatpak) are served by pipewire-pulse, not by this file.
stream.properties = {
    channelmix.upmix = false
}
