# Card profiles and node priorities.
#
# Priority numbers are chosen against values read from this machine:
#   Hive sink   1109
#   BRIO source 2109
#   filter sink 2000 (set in the virtual-surround graph)
#
# priority.driver is deliberately NOT set: get_session_priority only falls back
# to it when priority.session is absent, so it is redundant for routing - but it
# DOES influence PipeWire's graph-driver election, and setting it on the mic
# would make the capture side a driver candidate.
#
# So: Maxwell Game (1500) beats the Klipsch as the filter's target device, the
# Maxwell mic (2200) beats the BRIO while connected, the surround sink (2000)
# stays default over both hardware sinks, and Chat (100) is never auto-picked.
monitor.alsa.rules = [
  # ---- card profiles ----

  # pro-audio is the only profile that exposes both Maxwell endpoints
  # (hw:4,0 Game + hw:4,1 Chat) plus the boom mic. WirePlumber's
  # find-best-profile.lua explicitly skips pro-audio during auto-selection,
  # so this line is required, not cosmetic.
  {
    matches = [ { device.name = "alsa_card.usb-Audeze_LLC_Audeze_Maxwell_XBOX_Dongle_0000000000000000-00" } ]
    actions = { update-props = { device.profile = "pro-audio" } }
  }

  # ROG Strix Hive -> Klipsch 2.1 on the analog jack.
  # Output-only on purpose: Duplex creates a source at priority 2109, one point
  # above the BRIO at 2108, and jack detect confirms nothing with a mic pin is
  # plugged in ('Headset - Input Jack' : off). That phantom mic would outrank
  # the real fallback microphone.
  {
    matches = [ { device.name = "alsa_card.usb-Generic_USB_Audio-00" } ]
    actions = { update-props = { device.profile = "output:analog-stereo" } }
  }

  # BRIO on its analog input, not the mislabeled IEC958 one. On a USB card
  # iec958:CARD=N resolves to the same hw:N,0 - identical bits, but with an
  # S/PDIF port that has no mixer controls and no jack detection.
  {
    matches = [ { device.name = "alsa_card.usb-046d_Logitech_BRIO_849A5B02-03" } ]
    actions = { update-props = { device.profile = "input:analog-stereo" } }
  }

  # ---- names and priorities ----
  # hw:4,0 is the DUPLEX function - Speaker terminal 3 paired with Microphone
  # terminal 5. On a game/chat headset the bidirectional side is chat. Verified
  # by ear: the balance wheel's chat icon controls this endpoint.
  # (Audeze's docs say "the first one is Game" - that is Windows enumeration
  # order and does not match ALSA device order. Do not trust it.)
  {
    matches = [ { node.name = "alsa_output.usb-Audeze_LLC_Audeze_Maxwell_XBOX_Dongle_0000000000000000-00.pro-output-0" } ]
    actions = { update-props = {
      node.description = "Maxwell - Chat"
      priority.session = 100
    } }
  }
  # hw:4,1 is playback-only (Speaker terminal 11, no mic) - the game/media side.
  # Everything that is not voice chat goes here: the HRTF chain and music alike.
  {
    matches = [ { node.name = "alsa_output.usb-Audeze_LLC_Audeze_Maxwell_XBOX_Dongle_0000000000000000-00.pro-output-1" } ]
    actions = { update-props = {
      node.description = "Maxwell - Game"
      priority.session = 1500
    } }
  }
  {
    matches = [ { node.name = "alsa_input.usb-Audeze_LLC_Audeze_Maxwell_XBOX_Dongle_0000000000000000-00.pro-input-0" } ]
    actions = { update-props = {
      node.description = "Maxwell - Mic"
      priority.session = 2200
    } }
  }
  {
    matches = [ { node.name = "alsa_output.usb-Generic_USB_Audio-00.analog-stereo" } ]
    actions = { update-props = { node.description = "Klipsch 2.1" } }
  }
]
