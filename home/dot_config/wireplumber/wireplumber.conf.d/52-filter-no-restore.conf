# Stop WirePlumber persisting/restoring volume and target for the HRTF chain.
#
# A stale entry had been restoring channelVolumes [1.520874, 1.520874] = +3.64 dB
# onto the filter's output on every instantiation. That sits AFTER 16 convolutions
# on a graph whose worst-case peak gain is +30.5 dB, so it is a clipping source on
# loud 7.1 - and it silently invalidated every A/B between the HRTF path and the
# music bypass.
#
# These two keys DO work via stream.rules: state-stream.lua reads them from the
# rules-updated property copy. Note that target.object and node.dont-move do NOT
# work here - those are read from si_props (real node properties), which this
# section cannot write. Put those in the graph or in client.conf.d instead.
stream.rules = [
  {
    matches = [
      { media.name = "Virtual Surround 7.1" }
      { node.name = "effect_input.virtual-surround-7.1-atmos.output" }
    ]
    actions = { update-props = {
      state.restore-props  = false
      state.restore-target = false
    } }
  }
]
