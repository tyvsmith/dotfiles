{{- /* chezmoi:modify-template */ -}}
{{- /*
  Merge the repo's pinned mise packages (.chezmoitemplates/mise-packages.lock,
  regenerated by scripts/mise-lock) into this machine's global mise.lock,
  which mise itself also writes (toolchains, `mise use -g`, `mise upgrade`).

  Per managed tool:
    - missing locally, or the repo pins a newer version -> take the repo entry
    - same version but different entry (e.g. new platform) -> take the repo entry
    - local version newer (upgraded on this machine) -> keep local
  Tools the repo does not manage are never touched or removed. When nothing
  changes the file is emitted byte-for-byte, so mise's formatting survives.
*/ -}}
{{- $repo := include ".chezmoitemplates/mise-packages.lock" | fromToml -}}
{{- $cur := dict -}}
{{- if .chezmoi.stdin }}{{ $cur = .chezmoi.stdin | fromToml }}{{ end -}}
{{- $tools := dict -}}
{{- if hasKey $cur "tools" }}{{ $tools = $cur.tools }}{{ end -}}
{{- $semver := `^v?[0-9]+(\.[0-9]+){0,2}([-+].*)?$` -}}
{{- $changed := false -}}
{{- range $name, $entries := $repo.tools -}}
{{-   $take := true -}}
{{-   if hasKey $tools $name -}}
{{-     $local := index $tools $name -}}
{{-     $rv := (index $entries 0).version -}}
{{-     $lv := (index $local 0).version -}}
{{-     if eq $rv $lv -}}
{{-       $take = ne (toJson $entries) (toJson $local) -}}
{{-     else if and (regexMatch $semver $rv) (regexMatch $semver $lv) (semverCompare (printf "> %s" $rv) $lv) -}}
{{-       $take = false -}}
{{-     end -}}
{{-   end -}}
{{-   if $take }}{{ $_ := set $tools $name $entries }}{{ $changed = true }}{{ end -}}
{{- end -}}
{{- if $changed -}}
{{-   $_ := set $cur "tools" $tools -}}
{{-   if not (hasKey $cur "lockfile_version") }}{{ $_ := set $cur "lockfile_version" $repo.lockfile_version }}{{ end -}}
{{-   $cur | toToml -}}
{{- else -}}
{{-   .chezmoi.stdin -}}
{{- end -}}
