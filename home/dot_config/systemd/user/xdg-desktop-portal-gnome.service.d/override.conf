# xdg-desktop-portal-gnome checks XDG_CURRENT_DESKTOP and GDK_BACKEND at start;
# on Hyprland it logs "Non-compatible display server, exposing settings only"
# and drops the FileChooser interface. Faking GNOME for this unit alone keeps
# the GNOME file picker selected in ../../xdg-desktop-portal/hyprland-portals.conf
# working. An org.gnome.Mutter.ServiceChannel warning in the journal is harmless.
# Remove this directory (and set FileChooser back to gtk) to undo.
[Service]
Environment="XDG_CURRENT_DESKTOP=GNOME"
UnsetEnvironment=GDK_BACKEND
