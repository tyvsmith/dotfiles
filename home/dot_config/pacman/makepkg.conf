# User override sourced AFTER /etc/makepkg.conf by makepkg.
# Purpose: strip every $HOME/* path from PATH so AUR PKGBUILDs use only
# Arch system tools (/usr/bin, /usr/local/bin, /opt/*). This matches Arch's
# "depends/makedepends" contract — PKGBUILDs should declare what they need
# from pacman, and AUR helpers like paru should install those system packages
# before building. Required toolchains (rust, go, python, etc.) are declared
# in .chezmoidata/packages.yaml so they're available system-wide; daily-use
# language versions still come from mise in the user's shell.
#
# Why not a chroot build (paru --chroot)? Tried — voxtype-git's dynamic links
# pointed at user-managed libs unavailable inside the clean container. The
# scrub approach keeps system /opt/* in PATH so /opt/cuda/bin etc. still work.
#
# Pacman is arch-only, so this file is inert on other distros and on macOS.

PATH=$(printf '%s' "$PATH" | tr ':' '\n' \
    | grep -vE "^$HOME/" \
    | paste -sd: -)
export PATH
