# Third-party repos spliced before all repositories by the pre-refresh-pacman
# hook so CPU-optimized CachyOS builds win over both Omarchy and stock Arch.
# Mirrorlists are system-owned (cachyos-mirrorlist package + rate-mirrors).

[cachyos-znver4]
Include = /etc/pacman.d/cachyos-v4-mirrorlist

[cachyos-core-znver4]
Include = /etc/pacman.d/cachyos-v4-mirrorlist

[cachyos-extra-znver4]
Include = /etc/pacman.d/cachyos-v4-mirrorlist

[cachyos]
Include = /etc/pacman.d/cachyos-mirrorlist
