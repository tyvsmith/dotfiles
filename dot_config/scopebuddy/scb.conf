# ~/.config/scopebuddy/scb.conf
#
# Layer 2: defaults every game inherits. Sourced as bash BEFORE
# AppID/<appid>.conf, so anything a per-title file sets wins over this.
#
# Layering, per Item 20 of the CachyOS-on-Omarchy performance plan:
#   layer 0  ~/.config/environment.d/gaming.conf   every GL/Vulkan client
#   layer 2  this file                              every game
#   layer 3  AppID/<appid>.conf                     one title, overrides layer 2
#   layer 4  Steam launch options                   wrapper + game arguments

# ---------------------------------------------------------------------------
# Gamescope: off by default. Opt in per title with SCB_NOSCOPE=0 and
# SCB_GAMESCOPE_ARGS in that title's AppID conf.
# ---------------------------------------------------------------------------
SCB_NOSCOPE=1
SCB_GAMESCOPE_ARGS=""

# ---------------------------------------------------------------------------
# Gaming defaults. Derived from what the library actually used before the
# migration: 12 of 12 Proton titles set Wayland, and 12 of 12 asked for HDR
# (9 via DXVK_HDR, 3 via the retired PROTON_ENABLE_HDR).
# ---------------------------------------------------------------------------

# Wine-Wayland. Still work in progress upstream; opt a title out below if it
# misbehaves, rather than removing it here.
export PROTON_ENABLE_WAYLAND=1

# HDR. Also what ~/.config/hypr/monitors.lua watches for: any window whose
# process has this set drives the monitor into HDR for as long as it lives.
# SDR titles launched this way get Hyprland's sdrbrightness=1.35 compensation.
export DXVK_HDR=1

# Proton-CachyOS's own DLSS upgrade path. A no-op on titles without DLSS.
# Item 4: never combine with dlss-swapper. See the opt-out note below --
# a newer DLL can change image quality or upset anti-cheat on an untested title.
export PROTON_DLSS_UPGRADE=1

# MangoHud, on by default. These titles are all Vulkan (DXVK/VKD3D), and
# MangoHud's implicit Vulkan layer declares enable_environment MANGOHUD=1, so
# the env var is sufficient -- no `mangohud` wrapper and no LD_PRELOAD needed,
# which also avoids stacking a preload with gamemoderun's.
# The OpenGL shim would need the wrapper; nothing here uses it.
export MANGOHUD=1

# fps_limit caps frames just under the panel's 165.058 Hz. Above the VRR
# ceiling the display falls back to fixed refresh, which reintroduces the
# vsync latency penalty VRR exists to avoid. 161 leaves ~4 Hz of headroom.
#
# Pair this with VSync ON in the game: Omarchy sets allow_tearing = false, so
# the compositor never tears and VSync off would only render frames that are
# then discarded.
export MANGOHUD_CONFIG=preset=2,fps_limit=161

export PROTON_LOG_DIR="$HOME/.cache/proton-logs"

# ---------------------------------------------------------------------------
# Wrapper chain.
#
# ScopeBuddy has no dedicated wrapper option, but it `eval`s $command after
# sourcing these config files, and the README documents $command as available
# to them. Prepending here keeps the Steam launch string down to a bare
# `scb -- %command%` for every title.
#
# Order, outermost first:
#   game-performance  systemd-inhibit + a power-profiles-daemon performance
#                     hold, and it moves an active scx scheduler to its gaming
#                     profile. On this machine the profile is already
#                     `performance` and no scx scheduler is attached, so its
#                     live contribution is the idle inhibitor -- which matters,
#                     because GameMode's inhibit_screensaver does not work
#                     under Hyprland.
#   gamemoderun       registers with gamemoded, which pins the process and its
#                     children to the V-Cache CCD (0-7,16-23). See
#                     ~/.config/gamemode.ini.
#
# Opt a title out in its AppID conf by rebuilding the variable, e.g.
#   command="${command#game-performance gamemoderun }"
# ---------------------------------------------------------------------------
command="game-performance gamemoderun $command"
#command="game-performance $command"

# ---------------------------------------------------------------------------
# Opting a title OUT. These are exports, so a per-title file unsets them:
#
#   # ~/.config/scopebuddy/AppID/<appid>.conf
#   unset PROTON_ENABLE_WAYLAND     # this title breaks on Wine-Wayland
#   unset DXVK_HDR                  # SDR title; leave the monitor alone
#   unset PROTON_DLSS_UPGRADE       # keep the shipped DLSS DLL
#   export MANGOHUD=0               # or DISABLE_MANGOHUD=1; no overlay
#
# Never set anywhere. Verified zero occurrences in the installed runner
# (proton-cachyos 11.0-20260703) on 2026-08-22, so they are silently ignored:
#   PROTON_ENABLE_HDR   PROTON_VKD3D_HEAP   PROTON_USE_NTSYNC
#
# SCB_AUTO_HDR stays off: it exports the retired PROTON_ENABLE_HDR, and its
# display detection is KDE/GNOME only (the wlroots branch is a stub), so it is
# inert on Hyprland regardless.
#
# NOT settable here: /WineDetectionEnabled:False is a GAME ARGUMENT, not an
# environment variable. It stays in the Steam launch string after %command%.
# ---------------------------------------------------------------------------

# Uncomment during a migration to log the expanded command to
# ~/.config/scopebuddy/scopebuddy.log
#SCB_DEBUG=1
