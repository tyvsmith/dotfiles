# ~/.config/scopebuddy/scb.conf
#
# Layer 2: defaults every game inherits. Sourced as bash BEFORE
# AppID/<appid>.conf, so anything a per-title file sets wins over this.
#
# Layering, per Item 20 of the CachyOS-on-Omarchy performance plan:
#   layer 0  ~/.config/environment.d/gaming.conf   every GL/Vulkan client
#   layer 2  this file, then modes/native.conf     every game
#   layer 3  AppID/<appid>.conf                    one title; may switch with
#                                                  `mode gamescope`, override after
#   layer 4  Steam launch options                  wrapper + game arguments

# ---------------------------------------------------------------------------
# Gaming defaults that hold in BOTH modes. Anything whose value differs
# between gamescope and native lives in modes/<name>.conf, never here.
# ---------------------------------------------------------------------------

export PROTON_DLSS_UPGRADE=1
export MANGOHUD=1

# 161 keeps VRR headroom under the panel's 165.058 Hz ceiling. Only the
# in-process layer can enforce it, so gamescope mode re-issues it to the game
# in a private MANGOHUD_CONFIG (see modes/gamescope.conf).
fps_cap=161
export MANGOHUD_CONFIG=preset=2,fps_limit=$fps_cap
export PROTON_LOG_DIR="$HOME/.cache/proton-logs"

# ---------------------------------------------------------------------------
# Wrapper chain, as pristine pieces the mode files assemble into $command.
#
# ScopeBuddy has no dedicated wrapper option, but it `eval`s $command after
# sourcing these config files, and the README documents $command as available
# to them. Building the chain here keeps the Steam launch string down to a
# bare `scb -- %command%` for every title.
#
# Order, outermost first:
#   game-performance  systemd-inhibit + a power-profiles-daemon performance
#                     hold, and it moves an active scx scheduler to its gaming
#                     profile. On this machine the profile is already
#                     `performance` and no scx scheduler is attached, so its
#                     live contribution is the idle inhibitor -- which matters,
#                     because GameMode's inhibit_screensaver does not work
#                     under Hyprland.
#   gamemoderun       registers with gamemoded, which pins the process and its
#                     children to the V-Cache CCD (0-7,16-23). See
#                     ~/.config/gamemode.ini.
# ---------------------------------------------------------------------------
game_command="$command"
wrapped_command="game-performance gamemoderun $game_command"

# The one HDR prewarm both modes invoke; each mode file decides the delivery
# (SCB_PRE_COMMAND vs a command= prefix). Hold/revert mechanics:
# hypr/sticky_hdr.lua.
hdr_prewarm="hyprctl eval \"require('hypr.sticky_hdr').prewarm()\""

# ---------------------------------------------------------------------------
# Modes. Each modes/<name>.conf writes the COMPLETE conflicting set -- sets
# its own side, unsets the other's -- so `mode X` is a full state transition:
# idempotent, correct whatever ran before it. A per-title conf switches with
# `mode gamescope`, then overrides after (straight-line bash, later lines win).
# ---------------------------------------------------------------------------
mode() { source "$HOME/.config/scopebuddy/modes/$1.conf"; }
mode native

# ---------------------------------------------------------------------------
# Opting a title OUT. These are exports, so a per-title file unsets them:
#
#   # ~/.config/scopebuddy/AppID/<appid>.conf
#   unset PROTON_ENABLE_WAYLAND     # this title breaks on Wine-Wayland
#   unset DXVK_HDR                  # SDR title -- and ALSO rebuild:
#   command="$wrapped_command"      #   native mode baked the HDR prewarm
#                                   #   into $command; drop it too
#   unset PROTON_DLSS_UPGRADE       # keep the shipped DLSS DLL
#   export MANGOHUD=0               # or DISABLE_MANGOHUD=1; no overlay
#
# The wrapper chain is rebuilt from the pristine pieces, not pattern-stripped.
# After the mode line, e.g. drop the wrappers but keep the prewarm:
#   command="$hdr_prewarm; $game_command"   # native titles
#   command="$game_command"                 # gamescope titles (no `;` allowed)
#
# Never set anywhere. Verified zero occurrences in the installed runner
# (proton-cachyos 11.0-20260703) on 2026-08-22, so they are silently ignored:
#   PROTON_ENABLE_HDR   PROTON_VKD3D_HEAP   PROTON_USE_NTSYNC
#
# SCB_AUTO_HDR stays off: it exports the retired PROTON_ENABLE_HDR, and its
# display detection is KDE/GNOME only (the wlroots branch is a stub), so it is
# inert on Hyprland regardless.
#
# Game ARGUMENTS (e.g. /WineDetectionEnabled:False) are not env vars. Append
# them in the AppID conf with  command="$command <arg>"  -- and after the
# `mode` line if the title has one, since a mode rebuilds $command wholesale.
# ---------------------------------------------------------------------------

# Uncomment during a migration to log the expanded command to
# ~/.config/scopebuddy/scopebuddy.log
#SCB_DEBUG=1
