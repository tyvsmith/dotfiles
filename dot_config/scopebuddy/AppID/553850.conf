# HELLDIVERS 2 (appid 553850)
#
# Common settings and the wrapper chain come from ../scb.conf.
# The stray nProtect GameGuard window is handled in ~/.config/hypr/windows.lua,
# which parks it on special:hidden at map time.

# --- DLSS render preset: TESTING 2026-08-22 --------------------------------
# Presets are NOT quality modes. Quality/Balanced/Performance/DLAA choose the
# render resolution; the preset chooses which trained model does the upscaling.
# The two are orthogonal -- any quality mode can run any preset.
#
#   A-F  the CNN-era models. D is the usual default for Quality/Balanced/
#        Performance, F is the default for Ultra Performance and DLAA.
#   J    baseline DLSS 4 transformer model, a generational step over any CNN.
#   K    refines J, notably less vegetation shimmer. Highest this runner
#        implements -- the enum stops at K here, despite reports recommending
#        "M" or "L" which do not exist in this DXVK-NVAPI build.
#
# Note this is NOT the form ProtonDB reports use. PROTON_ENABLE_NGX_UPDATER
# does not exist in proton-cachyos (PROTON_DLSS_UPGRADE, set globally in
# ../scb.conf, is its equivalent), and the per-setting env var is not read
# either. proton-cachyos takes one combined variable; see its
# protonfixes/upscalers.py.
#
# To A/B this, comment the line out and relaunch -- the game falls back to
# whatever preset it selects natively.
# --- DLSS 4.5 (2nd-gen transformer) at Quality -------------------------------
# Measured 2026-08-22 with this override OFF. The game sets NGX app hints that
# are exactly NVIDIA's "Recommended" table:
#
#   DLAA K   Quality K   Balanced K   Perf M   UltraPerf L   UltraQuality K(default)
#
# K is DLSS 4, 1st-gen transformer. L and M are DLSS 4.5, 2nd-gen transformer.
# So NVIDIA's own default leaves Quality on the OLDER model. This override
# lifts Quality onto the newer one.
#
# 2nd-gen transformer relies on FP8 acceleration. This box is a 5090
# (m_gpuArch 0x1b0, Blackwell), so that is a non-issue here; it is the reason
# L/M are discouraged on RTX 20/30.
#
# COST: reported 3-44.5% fps vs K depending on title, measured at Perf mode.
# MANGOHUD_CONFIG in ../scb.conf caps at 161 fps, which may absorb it entirely.
#
# SCOPE: ngx_dlss_sr_override_render_preset_selection is a SINGLE GLOBAL value --
# there is no per-mode DRS key. This forces M on every SR mode, including
# UltraPerf, which NVIDIA assigns L. Irrelevant if Quality is what gets played.
#
# rr_override and fg_override are restored deliberately: protonfixes'
# upscalers.py sets DXVK_NVAPI_DRS_SETTINGS with env.setdefault, so any value
# here REPLACES its default wholesale rather than merging into it.
#
# To revert to the game's own choice, comment this out -- nothing else needed.
export DXVK_NVAPI_DRS_SETTINGS='ngx_dlss_sr_override=on,ngx_dlss_rr_override=on,ngx_dlss_fg_override=on,ngx_dlss_sr_override_render_preset_selection=RENDER_PRESET_M,ngx_dlss_rr_override_render_preset_selection=default,'

# --- READOUTS ---------------------------------------------------------------
# Two independent ways to see the active preset, so one launch settles it.

# 1. On-screen indicator. proton:2281 turns this into
#    DXVK_NVAPI_SET_NGX_DEBUG_OPTIONS=DLSSIndicator=1024,DLSSGIndicator=2 --
#    a separate code path from DXVK_NVAPI_DRS_SETTINGS, so it still works with
#    the override above commented out.
export PROTON_DLSS_INDICATOR=1

# 2. NGX log file, so the answer survives the session instead of needing to be
#    read off an overlay mid-firefight. nvngx_dlss.dll reads these three and
#    writes one of:
#      "Using App hint Preset %s"                       game asked for it
#      "App hint Preset Unspecified or Overridden, ..." DLL per-title default
#      "Using DRS Overridden Preset %s"                 an override won
#      "App hint Preset %s is not available, ..."       that letter is absent
#    These are Windows-side vars read inside the prefix, so the path is the Z:
#    mapping of ~/.cache/ngx-logs. Level 1 is Info; bump to 2 if it comes out
#    empty. Remove this whole block once the question is answered -- it is a
#    diagnostic, not a setting.
export __NGX_LOG_LEVEL=1
export __NGX_ENABLE_OVERRIDE_LOG_PATH=1
export __NGX_LOG_PATH_OVERRIDE='Z:\home\ty\.cache\ngx-logs'
