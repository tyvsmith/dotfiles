# Extra autostart processes
exec-once = hyprpm reload -n

exec-once = uwsm app -s a -- hypr-dock
exec-once = uwsm app -s b -- hypr-sticky-hdr daemon
#exec-once = uwsm app -s b -- vicinae server

# wait-for-sni blocks until waybar's StatusNotifierWatcher is on the bus so
# these apps' tray icons actually register on cold boot.
exec-once = uwsm app -s b -- wait-for-sni flatpak run com.core447.StreamController
exec-once = uwsm app -s b -- wait-for-sni lan-mouse
exec-once = uwsm app -s b -- wait-for-sni beeper
exec-once = uwsm app -s b -- wait-for-sni vesktop
exec-once = uwsm app -s b -- wait-for-sni slack
