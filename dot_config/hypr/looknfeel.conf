# Change the default Omarchy look'n'feel

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    # No gaps between windows or borders
    # gaps_in = 0
    # gaps_out = 0
    # border_size = 0

    # Use master layout instead of dwindle
    #layout = master
    layout = scrolling
}

# https://wiki.hypr.land/Configuring/Basics/Variables/#decoration
decoration {
    # Use round window corners
    # rounding = 8

    # Dim unfocused windows (0.0 = no dim, 1.0 = fully dimmed)
    # dim_inactive = true
    # dim_strength = 0.15
}


animations {
  enabled = true
  bezier = mybezier,0.05, 0.9, 0.1, 1.05
  animation = workspaces, 1, 6, mybezier, slidevert


  bezier = md3_decel, 0.05, 0.7, 0.1, 1
  bezier = md3_accel, 0.03, 0, 0.8, 0.15
  animation = hyprfocusIn, 1, 1.7, md3_accel
  animation = hyprfocusOut, 1, 1.7, md3_accel

}

# https://wiki.hypr.land/Configuring/Basics/Variables/#layout
layout {
    # Avoid overly wide single-window layouts on wide screens
    # single_window_aspect_ratio = 1 1
}

# https://wiki.hypr.land/Configuring/Layouts/Scrolling-Layout/
scrolling {
    # Default column width (0.1 - 1.0)
    column_width = 0.333
    # Don't auto-maximize a lone column; honor column_width instead
    fullscreen_on_one_column = false
    # 1 = fit (Niri-like), 0 = center the focused column on screen
    focus_fit_method = 1
    # Auto-scroll the tape to bring the focused window into view
    follow_focus = true
    # Min fraction of a window that must already be visible for follow_focus
    # to NOT kick in (0.0 - 1.0). Hard input (binds, clicks) always follows.
    follow_min_visible = 0.4
    # Wrap focus/swap at the ends of the tape
    wrap_focus = true
    wrap_swapcol = true
    # Width presets cycled by colresize +conf / -conf
    explicit_column_widths = 0.333, 0.5, 0.667, 1.0
}

plugin {
    # hyprfocus defaults: mode=flash, slide_height=20
    hyprfocus {
        mode = slide
        slide_height = 10
    }

    # scrolloverview defaults: scale=0.5, workspace_gap=0, gesture_distance=300,
    # wallpaper=0, blur=false, shadow.enabled=false.
    scrolloverview {
        scale = 0.6
        workspace_gap = 100
    }

    # hyprglass defaults: default_theme=dark, default_preset=default,
    # tint_color=0x8899aa22, dark:brightness=0.82, layers.enabled=false.
    hyprglass {
        default_preset = clear

        brightness = 0.9
        light:adaptive_boost = 0.5

        preset = name:clear, glass_opacity:0.8, blur_strength:1.5
        preset = name:clear:dark, brightness:0.7
        preset = name:clear:light, brightness:1.2

        preset = name:contrasted, inherits:high_contrast, contrast:1.2, adaptive_dim:1.5
        preset = name:contrasted:dark, tint_color:0x02142aa9

        layers {
            enabled = 1
            namespaces = waybar, swaync, quickshell:bezel
            exclude_namespaces = debug-panel
            preset = subtle
            namespace_presets = quickshell:bezel:ui
            namespace_mask_thresholds = waybar=0.05, quickshell:bezel=0.3
        }
    }

    # dynamic-cursors: only the shaperules diverge from defaults. Top-level
    # (enabled=true, mode=tilt, threshold=2) and every subblock (rotate, tilt,
    # stretch, shake, hyprcursor) match upstream documented defaults exactly.
    dynamic-cursors {
        shaperule = text, rotate:offset: 90
        shaperule = grab, stretch, stretch:limit: 2000
        shaperule = clientside, none
    }
}
