
# NVIDIA (Turing+ with GSP firmware)
# NVD_BACKEND=direct dropped: already the default in libva-nvidia-driver v0.0.12+.
# __GLX_VENDOR_LIBRARY_NAME=nvidia dropped: GLVND autodetects; explicit setting
#   has caused Wayland login regressions on some NVIDIA driver releases.
env = LIBVA_DRIVER_NAME,nvidia

# Qt/Kirigami theming: use qt6ct as the Qt6 platform theme. The THPM theme
# framework regenerates ~/.config/qt6ct/colors/omarchy.conf from the active
# omarchy theme on every theme change (hooks/theme-set.d/10-qt6ct.sh), so Qt6
# apps track the theme I actually set. Omarchy only ships QT_STYLE_OVERRIDE=
# kvantum, which styles QtWidgets but not Kirigami/QtQuick — qt6ct's palette
# (custom_palette=true) is what feeds Kirigami apps their dark colors.
env = QT_QPA_PLATFORMTHEME,qt6ct
