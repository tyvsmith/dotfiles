# See https://wiki.hyprland.org/Configuring/Monitors/
# List current monitors and resolutions possible: hyprctl monitors
# Format: monitor = [port], resolution, position, scale

# Optimized for retina-class 2x displays, like 13" 2.8K, 27" 5K, 32" 6K.
#env = GDK_SCALE,2
#monitor=,preferred,auto,auto

# Good compromise for 27" or 32" 4K monitors (but fractional!)
# env = GDK_SCALE,1.75
# monitor=,preferred,auto,1.6

# Straight 1x setup for low-resolution displays like 1080p or 1440p
# env = GDK_SCALE,1
# monitor=,preferred,auto,1

# Example for Framework 13 w/ 6K XDR Apple display
# monitor = DP-5, 6016x3384@60, auto, 2
# monitor = eDP-1, 2880x1920@120, auto, 2
#

# HDR setup
#env = GDK_SCALE,1.5
#monitor = ,preferred,auto,auto,bitdepth,10,cm,hdr,vrr,2
# optional tuning for SDR apps while HDR is enabled:
#monitor = ,preferred,auto,auto,bitdepth,10,cm,hdr,vrr,2,sdrbrightness,1.4,sdrsaturation,1.0


#Manual
#HDR mode for gaming
$monitor_hdr = ,5120x2160@165.06,auto,auto,bitdepth,10,cm,hdr,vrr,2,sdrbrightness,1.35,sdrsaturation,1.0
#SDR Mode for non-gaming
$monitor_sdr = ,5120x2160@165.06,auto,auto,bitdepth,10,cm,srgb,vrr,2,sdrbrightness,1.0,sdrsaturation,1.0

monitor = $monitor_sdr



#Will autoswitch to HDR in full screen app and keep it HDR until game exits
