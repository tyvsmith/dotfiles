# Application bindings
bindd = SUPER, RETURN, Terminal, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER ALT, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" tmux new
bindd = SUPER SHIFT, RETURN, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT, F, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER ALT SHIFT, F, File manager (cwd), exec, uwsm-app -- nautilus --new-window "$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, B, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT ALT, B, Browser (private), exec, omarchy-launch-browser --private
bindd = SUPER SHIFT, M, Music, exec, omarchy-launch-or-focus spotify
bindd = SUPER SHIFT ALT, M, Music TUI, exec, omarchy-launch-or-focus-tui cliamp
bindd = SUPER SHIFT, E, Editor, exec, omarchy-launch-editor
bindd = SUPER SHIFT, D, Docker, exec, omarchy-launch-tui lazydocker
bindd = SUPER SHIFT, C, Chat (Beeper), exec, omarchy-launch-or-focus ^beeper$ "uwsm-app -- beeper"
bindd = SUPER SHIFT, G, Steam, exec, omarchy-launch-or-focus ^steam$ "uwsm-app -- steam"
bindd = SUPER SHIFT, O, Obsidian, exec, omarchy-launch-or-focus ^obsidian$ "uwsm-app -- obsidian"
bindd = SUPER SHIFT, SLASH, Passwords, exec, uwsm-app -- 1password

# If your web app url contains #, type it as ## to prevent hyprland treating it as a comment
bindd = SUPER SHIFT ALT, A, ChatGPT, exec, omarchy-launch-or-focus-webapp ChatGPT "https://chatgpt.com"
bindd = SUPER SHIFT CTRL, A, Claude, exec, omarchy-launch-or-focus-webapp Claude "https://claude.ai"
bindd = SUPER SHIFT ALT, C, Google Calendar, exec, omarchy-launch-or-focus-webapp Gcalendar "https://calendar.google.com"
bindd = SUPER SHIFT ALT, E, Gmail, exec, omarchy-launch-or-focus-webapp Gmail "https://gmail.com"
bindd = SUPER SHIFT ALT, G, Github, exec, omarchy-launch-webapp Github "https://github.com/"

# Dictation toggle (F16 = evdev keycode 186 → xkb keycode 194)
#bindd = , code:194, Toggle dictation, exec, voxtype record toggle
bindd = , code:194, Toggle dictation, exec, voxtype-smart-toggle

# Free F9 for app shortcuts (omarchy default uses it as push-to-talk dictation)
unbind = , F9


bindd = SUPER, page_down, Next workspace, workspace, e+1
bindd = SUPER, page_up, Previous workspace, workspace, e-1

bindd = SUPER SHIFT, page_down, Move to next workspace, movetoworkspace, e+1
bindd = SUPER SHIFT, page_up, Move to previous workspace, movetoworkspace, e-1
# bind = SUPER SHIFT, R, exec, alacritty -e ssh your-server

# Invert SUPER+scroll to match natural-scroll direction (overrides omarchy default)
unbind = SUPER, mouse_down
unbind = SUPER, mouse_up
bindd = SUPER, mouse_down, Scroll active workspace backward, workspace, e-1
bindd = SUPER, mouse_up,   Scroll active workspace forward,  workspace, e+1
bindd = SUPER SHIFT, mouse_down, Scroll active workspace backward, movetoworkspace, e-1
bindd = SUPER SHIFT, mouse_up,   Scroll active workspace forward,  movetoworkspace, e+1

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space

bindd = Super, D, Toggle Dock, exec, hypr-dock
bindd = SUPER, E, Overview, scrolloverview:overview, toggle

# --- Hyprland scrolling layout: first-class bindings (0.55+) ---

# Column composition (Niri-style; COMMA family is owned by Mako notifications)
bindd = SUPER, bracketleft,  Consume or expel toward prev, layoutmsg, consume_or_expel prev
bindd = SUPER, bracketright, Consume or expel toward next, layoutmsg, consume_or_expel next
bindd = SUPER,       period, Expel window into its own column,    layoutmsg, expel
bindd = SUPER SHIFT, period, Consume window into previous column, layoutmsg, consume
bindd = SUPER ALT,   period, Promote window out of stack,         layoutmsg, promote

# Column reordering on the tape (SHIFT+brackets — leaves SUPER+ALT+arrows for groups)
bindd = SUPER SHIFT, bracketleft,  Move column left,  layoutmsg, swapcol l
bindd = SUPER SHIFT, bracketright, Move column right, layoutmsg, swapcol r

# Fit / zoom — I family (Inspect). SUPER+CTRL+I reserved for idle-lock toggle.
bindd = SUPER,       I, Fit active column,    layoutmsg, fit active
bindd = SUPER ALT, I, Fit visible columns,  layoutmsg, fit visible
bindd = SUPER SHIFT,   I, Fit entire tape,      layoutmsg, fit all

# Center the active column on screen (Niri's Mod+C analog)
bindd = SUPER ALT,   C, Center active column, layoutmsg, center

# Tape-end peek (slide view; doesn't change focus)
bindd = SUPER, HOME, Slide view to first column, layoutmsg, fit tobeg
bindd = SUPER, END,  Slide view to last column,  layoutmsg, fit toend

# Column width cycling (presets in scrolling.explicit_column_widths)
bindd = SUPER,       R, Cycle column width forward,  layoutmsg, colresize +conf
bindd = SUPER SHIFT, R, Cycle column width backward, layoutmsg, colresize -conf

# View pinning (don't auto-scroll on focus changes)
bindd = SUPER, backslash, Toggle scroll inhibit (pin view), layoutmsg, inhibit_scroll

# View-only mouse scroll — focus stays, camera slides over the tape.
# SUPER+mouse = workspace nav; SUPER+ALT+mouse = group nav; SUPER+CTRL = view scroll.
bindd = SUPER, mouse_left,   Scroll view one column backward, layoutmsg, move -col
bindd = SUPER, mouse_right, Scroll view one column forward,  layoutmsg, move +col
bindd = SUPER SHIFT, mouse_left,   Scroll view one column backward, layoutmsg, swapcol l
bindd = SUPER SHIFT, mouse_right, Scroll view one column forward,  layoutmsg, swapcol r
# --- end scrolling layout bindings ---

# Scroll layout incrementally
bindde = SUPER CTRL, bracketleft,  Slow-scroll view left,  layoutmsg, move +120
bindde = SUPER CTRL, bracketright, Slow-scroll view right, layoutmsg, move -120

