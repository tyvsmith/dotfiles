[parakeet]
model = "parakeet-tdt-0.6b-v3"
#model = "parakeet-unified-en-0.6b" #uses for streaming
on_demand_loading = false
streaming = false

streaming_chunk_secs = 0.32
streaming_left_context_secs = 5.6
streaming_right_context_secs = 0.32

[meeting]
enabled = false

[meeting.diarization]
enabled = false

[meeting.audio]
source = "mic"

[osd]
enabled = true
frontend = "gtk4"
position = "bottom-center"
width_px = 400
height_px = 48
margin_px = 24
top_margin = 0.85
opacity = 0.95
waveform_window_secs = 3.0
peak_decay_db_per_sec = 6.0
waveform_gain = 10.0

[status]
icon_theme = "emoji"

# ---- voxtype-context-cleanup additions ----

# Global fallback when no profile is selected
[output.post_process]
command = "voxtype-cleanup"
timeout_ms = 10000

# One profile per category in categories.yaml.
# Each calls the same script with a category hint; the script re-detects
# the active window at completion time and may override the hint.

[profiles.chat]
post_process_command = "voxtype-cleanup --hint chat"

[profiles.email]
post_process_command = "voxtype-cleanup --hint email"

[profiles.code]
post_process_command = "voxtype-cleanup --hint code"

[profiles.docs]
post_process_command = "voxtype-cleanup --hint docs"

[profiles.browser]
post_process_command = "voxtype-cleanup --hint browser"

[profiles.general]
post_process_command = "voxtype-cleanup --hint general"
