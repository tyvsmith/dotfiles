# Override Voxtype's default output driver chain to prefer ydotool over wtype.
#
# wtype injects keystrokes via the Wayland virtual-keyboard-v1 protocol,
# which races with Ghostty's kitty-keyboard-protocol implementation and
# drops the last character of words ending in certain letters before a
# space (e.g. "JSON format" → "JSO format", "3 pm tomorrow" → "3 P tomorrow").
#
# ydotool uses uinput (kernel-level hardware keyboard emulation), so no
# Wayland protocol is involved and the race doesn't exist. wtype stays as
# fallback for any environment where ydotool fails.
#
# The `ydotool` binary that Voxtype invokes is intercepted by the wrapper
# at ~/.local/share/overrides/bin/ydotool (first in PATH) which adds
# --key-delay=0 --key-hold=1 for dictation-grade speed (default 20+20ms
# would be unusably slow).
[Service]
ExecStart=
ExecStart=/usr/bin/voxtype --driver=ydotool,wtype,clipboard -q daemon
